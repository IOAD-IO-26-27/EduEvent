services:
    backend:
        volumes:
            - ./backend:/app
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - NEXT_PUBLIC_API_URL=http://localhost:8000
            - WATCHPACK_POLLING=true
