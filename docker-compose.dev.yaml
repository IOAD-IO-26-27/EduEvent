services:
    backend:
        volumes:
            - ./backend:/app
        command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
        environment:
            - PORT=8000
            - DATABASE_URL=postgresql://${BACKEND_USER}:${BACKEND_PASSWORD}@db:5432/${POSTGRES_DB}

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            - WATCHPACK_POLLING=true
