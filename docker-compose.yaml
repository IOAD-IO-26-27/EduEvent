services:
    db:
        image: postgis/postgis:17-3.5-alpine
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
            BACKEND_USER: ${BACKEND_USER}
            BACKEND_PASSWORD: ${BACKEND_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./db-init:/docker-entrypoint-initdb.d
        restart: always

    backend:
        build: ./backend
        ports:
            - "8000:8000"
        environment:
            - PORT=8000
            - DATABASE_URL=postgresql://${BACKEND_USER}:${BACKEND_PASSWORD}@db:5432/${POSTGRES_DB}
        depends_on:
            - db
        restart: always

    frontend:
        build: ./frontend
        ports:
            - "3000:3000"
        environment:
            - NEXT_PUBLIC_API_URL=http://localhost:8000
        depends_on:
            - backend
        restart: always

volumes:
    postgres_data:
